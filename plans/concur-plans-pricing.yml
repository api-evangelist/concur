specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: SAP Concur
providerId: concur
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Expense Management
  - Finance
  - Invoice
  - SAP
  - Travel
description: SAP Concur does not publish public, self-serve API pricing. API access is gated behind the
  customer's existing SAP Concur (Expense, Travel, Invoice, Request) subscription and the partner program
  (Concur Connect / App Center). Pricing is enterprise-quoted per customer and is not exposed through
  a developer pricing page.
notes: API access is included as part of the customer's SAP Concur subscription and partner agreement.
  Concur does not publish per-call or per-tier API pricing publicly. Reconcile against an actual SAP
  Concur quote or partner contract before relying on plan numbers.
sources:
  - https://developer.concur.com/api-reference/
  - https://www.concur.com/
plans:
  - id: concur-bundled
    name: Bundled with SAP Concur Subscription
    type: enterprise
    description: API access is delivered as part of an active SAP Concur Expense, Travel, Invoice, or
      Request subscription. There is no separately published API tier; quotas, scopes, and rate limits
      are governed by the customer contract and the Concur Connect / App Center partner program.
    entries:
      - label: API Access
        description: API access bundled with the customer's SAP Concur subscription. Included scopes,
          quotas, and rate limits are not publicly published.
        name: api_access
        type: subscription
        metric: varies
        limit: 'see SAP Concur contract'
        timeFrame: year
        geo: global
        unit: 1
        price: 'see SAP Concur contract'
        userMultiplied: false
    elements:
      - name: SAP Concur Expense API
      - name: SAP Concur Travel API
      - name: SAP Concur Invoice API
      - name: SAP Concur Receipts API
      - name: SAP Concur Request API
      - name: SAP Concur User Provisioning API
      - name: SAP Concur Events API
      - name: SAP Concur Lists API
maintainers:
